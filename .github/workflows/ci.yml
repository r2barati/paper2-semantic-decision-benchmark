name: Offline benchmark tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      # Install into the clean runner environment ONLY from the declared
      # requirements. A previously green CI coexisted with 16 export failures
      # because it neither installed the simulator's real dependencies nor ran
      # the experimental tests.
      - run: python -m pip install -r requirements.lock

      # The vendored simulator must import from a bare declared environment.
      - name: Simulator imports from declared dependencies alone
        run: python -c "import sys; sys.path.insert(0,'third_party/gym-invmgmt-paper'); import gym_invmgmt.network_topology; print('simulator import ok')"

      # Reconstruct the offline artifacts the release does not track.
      - name: Rebuild offline artifacts
        run: python -m tools.rebuild_offline_artifacts

      - name: Verify offline artifacts are complete
        run: python -m tools.rebuild_offline_artifacts --verify

      # The FULL declared offline suite, not a three-file subset.
      - name: Full offline test suite
        run: python -m pytest -q tests/

      # At least one stored-belief simulation replay and one publication
      # regeneration, so a table that no longer reproduces fails CI.
      - name: Stored-belief replay and publication regeneration
        run: |
          python -m tools.verify_release --replay --regenerate
