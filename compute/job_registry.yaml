local_only:
  - job: track-b-vhat2
    code: tools/vhat2_train.py
    inputs:
      - data/v3/splits/splits.json
      - results/v3main/sim/episodes.parquet
      - results/v3main/beliefs_Qwen_Qwen3-8B-AWQ.parquet
      - results/v3main/beliefs_Qwen_Qwen3-14B-AWQ.parquet
      - kaggle/inputs_loo/
      - kaggle/inputs_loo_test/
      - runs/v3main/qwen3emb_main_vectors.npz
      - results/v3main/extension_g2a/loo_*.parquet
      - results/v3main/extension_g2a/c1_loo_*.parquet
      - results/v3main/extension_g2a/vhat_oof.parquet
    outputs:
      - results/v3main/extension_g2a/vhat2_oof.parquet
      - results/v3main/extension_g2a/vhat2_heads.pkl
      - results/v3main/extension_g2a/vhat2_model.json
      - results/v3main/extension_g2a/vhat2_gate.json
    note: Local-only by firewall design; no Kaggle JOBS entry.
