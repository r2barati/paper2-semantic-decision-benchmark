    dataset_dir: kaggle/inputs_tracka
    dest_dir: runs/v3main_tracka
    outputs: [episodes_tracka_b1.parquet, manifest_tracka_b1.json]
    verify: trackasim
    shard_spec: shard_b1.json
    gate: sample-5pct
    manifest: runs/v3main_tracka/manifest_tracka_b1.json

