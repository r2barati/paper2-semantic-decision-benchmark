# Job registry — active compute jobs (mirror, not source of truth)
# Source of truth for execution: scripts/kaggle_compute.py JOBS.
# This file is an organizational pointer created Phase 1; do not edit JOBS here.
# Track-B/VHAT2 is local-only by firewall design (no Kaggle entry).

jobs:
  - job: tracka-sim-pilot
    slug: paper2-tracka-sim-pilot
    script: kaggle_kernel/p2_tracka_sim.py
    dataset_slug: paper2-tracka-sim-inputs
    dataset_dir: kaggle/inputs_tracka
    dest_dir: runs/v3main_tracka
    outputs: [episodes_tracka_pilot.parquet, shard_manifest.json]
    verify: trackasim
    shard_spec: shard_pilot.json
    gate: full-overlap
    manifest: runs/v3main_tracka/shard_manifest.json

  - job: tracka-sim-b1
    slug: paper2-tracka-sim-b1
    script: kaggle_kernel/p2_tracka_b1.py
