scope: reranker-execution-only
scientific_protocol_unchanged: true
reason_for_amendment: >-
  Moon has 16 vCPU / 62 GB RAM but no accelerator. The only authorized change
  from the earlier four-thread profile is 16 intra-op threads after a fixed
  three-document non-lockbox parity gate against four threads. The CPU
  consumer route remains blocked by the separate GGUF/source blockers.

platform:
  provider: tmu-moon
  operator: OpenCode
  execution: cpu-only
  logical_vcpus: 16
  minimum_memory_gb: 60
  required_architecture: x86_64
  required_masked_instruction_flags: [avx2, avx512f]
  scratch_root: /tmp/sem2act-v5
  persistent_output_filesystem: nfs
  output_quota_minimum_free_bytes: 10000000
  output_quota_probe_bytes: 10000000
  instruction_flag_check: every /proc/cpuinfo processor record

runtime:
  python: 3.9.19
  torch: 2.8.0+cpu
  transformers: 4.57.6
  device: cpu
  dtype: float32
  intra_op_threads: 16
  inter_op_threads: 1
  torch_cuda: false
  torch_mps: false
  parity_gate:
    fixture: versions/sem2act-v5/fixtures/runtime_smoke_v1.json
    fixture_documents: 3
    reference_threads: 4
    candidate_threads: 16
    repeat_equality_per_profile: exact
    score_absolute_tolerance: 0.000001
    ranking_equality: exact

model:
  model_id: Qwen/Qwen3-Reranker-0.6B
  revision: e61197ed45024b0ed8a2d74b80b4d909f1255473
